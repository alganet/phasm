name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# Superseded PR pushes are worth cancelling; a main run that may be mid-deploy
# is not.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  # The website used to be its own workflow, which meant every push to main
  # built the whole toolchain twice and deployed a bundle whose tests had never
  # run. It is a consumer of the build now, not a second copy of it.
  deploy:
    name: Deploy website
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # actions-gh-pages pushes a commit to the gh-pages branch; it does not
      # use the Pages API, so `pages: write` was never doing anything here.
      contents: write
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: web-dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web-dist
          publish_branch: gh-pages
