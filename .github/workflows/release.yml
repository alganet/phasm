name: Release

on:
  push:
    tags:
      - '[0-9]+\.[0-9]+\.[0-9]+'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf bison re2c libonig-dev cmake wget pkg-config python3 git curl zip

      - run: ./scripts/setup.sh
      - run: ./scripts/fetch.sh
      - run: ./scripts/apply-patches.sh
      - run: ./scripts/deps.sh
      - run: ./scripts/build.sh

      # Never publish an unverified interpreter. Until this existed, a release
      # went to npm with no check that the binary could run PHP at all.
      - name: Test
        run: npm test

      # package.json promises dist/php.d.ts; make sure build.sh actually put it
      # there before the tarball is cut.
      - name: Verify package contents
        run: |
          for f in dist/php.js dist/php.wasm dist/php.d.ts; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          npm pack --dry-run

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
