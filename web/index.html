<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>PHP 8.5 WASM Demo</title>
	<style>
		body {
			font-family: system-ui, sans-serif;
			margin: 2rem auto;
			max-width: 52rem;
			padding: 0 1rem;
			line-height: 1.5;
		}

		#editor {
			width: 100%;
			height: 300px;
			font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
			border: 1px solid #ddd;
			border-radius: 4px;
			padding: .6rem;
			box-sizing: border-box;
			resize: vertical;
		}

		#output {
			white-space: pre-wrap;
			background: #111;
			color: #FFF;
			padding: 1rem;
			min-height: 200px;
			border-radius: 4px;
			overflow-x: auto;
		}

		#output .err {
			color: #ff8c8c;
		}

		button {
			font-size: 15px;
			padding: .35rem 1.2rem;
		}

		#status {
			color: #555;
		}
	</style>
	<!--
	  Analytics is the only cross-origin asset left on this page. It will NOT
	  load once the page becomes cross-origin isolated (roadmap Phase 6:
	  COOP/COEP injected from the service worker), because a subresource then
	  needs CORP. Kept deliberately for now — that milestone is where it has to
	  be resolved, either by dropping it or by routing it through the worker.
	-->

</head>

<body>
	<h1>PHP 8.5 WASM Demo</h1>
	<p>PHP compiled to WebAssembly, running entirely in this tab — no server.</p>
	<p id="status">Loading...</p>
	<textarea id="editor" spellcheck="false" aria-label="PHP source"></textarea>
	<div style="margin: .5rem 0;">
		<button id="runBtn" disabled>Run</button>
	</div>
	<pre id="output"></pre>

	<script>
		const statusEl = document.getElementById("status");
		const outputEl = document.getElementById("output");
		const editorEl = document.getElementById("editor");
		const runBtn = document.getElementById("runBtn");

		editorEl.value = `<?php

echo 'Hello World!' . PHP_EOL;
`;

		const write = (text, cls) => {
			const span = document.createElement("span");
			if (cls) span.className = cls;
			span.textContent = text;
			outputEl.appendChild(span);
		};

		// Emscripten's `print`/`printErr` options are LINE buffered: they fire
		// only on a newline and hand back the line with it stripped. Output that
		// does not end in one is never delivered at all — `<?php echo "hi";`
		// printed nothing. Collect the raw byte stream instead and decode it,
		// so what you see is exactly what PHP wrote.
		const decoder = new TextDecoder();
		const sink = (cls) => {
			let buf = [];
			return {
				push(c) {
					if (c === null) { this.flush(); return; }
					buf.push(c);
					if (c === 10) this.flush();
				},
				flush() {
					if (!buf.length) return;
					write(decoder.decode(Uint8Array.from(buf)), cls);
					buf = [];
				},
			};
		};

		if (typeof WebAssembly === "undefined") {
			statusEl.textContent = "WebAssembly unavailable";
			write("This demo requires a WebAssembly-enabled browser.", "err");
		} else {
			const script = document.createElement("script");
			script.src = "assets/php.js";
			script.onload = async () => {
				statusEl.textContent = "Initializing...";
				try {
					// One module instance per run: the CLI SAPI's main() does full
					// init AND shutdown, so state leaks across callMain() calls.
					// Booting per run keeps each one clean.
					const boot = () => {
						const out = sink(null), errOut = sink("err");
						return Phasm({
							noInitialRun: true,
							preRun: [(m) => m.FS.init(
								() => null,
								(c) => out.push(c),
								(c) => errOut.push(c),
							)],
						}).then((m) => {
							// Anything PHP wrote without a trailing newline is
							// still sitting in the buffer when it exits.
							m.flushOutput = () => { out.flush(); errOut.flush(); };
							return m;
						});
					};

					const php = await boot();

					const vendorRes = await fetch('assets/vendor.zip');
					if (!vendorRes.ok) throw new Error('Failed to fetch vendor.zip: ' + vendorRes.status);
					php.FS.writeFile('/vendor.zip', new Uint8Array(await vendorRes.arrayBuffer()));

					const mainRes = await fetch('assets/main.php');
					if (!mainRes.ok) throw new Error('Failed to fetch main.php: ' + mainRes.status);
					php.FS.writeFile('/main.php', await mainRes.text());

					statusEl.textContent = "Ready";
					php.callMain(["main.php"]);
					php.flushOutput();

					runBtn.disabled = false;
					runBtn.onclick = async () => {
						runBtn.disabled = true;
						statusEl.textContent = "Running...";
						outputEl.textContent = "";
						try {
							const run = await boot();
							run.FS.writeFile('/user.php', editorEl.value);
							const code = run.callMain(["user.php"]);
							run.flushOutput();
							statusEl.textContent = `Finished (exit ${code ?? 0})`;
						} catch (err) {
							write(`Failed to run: ${err && err.stack || err}`, "err");
							statusEl.textContent = "Failed";
						} finally {
							runBtn.disabled = false;
						}
					};
				} catch (err) {
					const msg = (err && (err.message || err.toString())) || "Failed to initialize";
					statusEl.textContent = msg;
					write(err && err.stack || msg, "err");
				}
			};
			script.onerror = () => {
				statusEl.textContent = "Failed to load php.js";
				write("Unable to load assets/php.js", "err");
			};
			document.body.appendChild(script);
		}
	</script>
</body>

</html>
